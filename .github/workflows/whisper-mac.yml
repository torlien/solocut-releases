name: whisper-cli macOS

# Compila o whisper-cli do whisper.cpp pra macOS (Apple Silicon com Metal + Intel),
# linkado estatico (so frameworks do sistema), pra embutir no SOLO CUT PRO.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: "tag do whisper.cpp"
        default: "b5130"

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Baixar whisper.cpp
        run: git clone --depth 1 --branch "${{ inputs.ref }}" https://github.com/ggml-org/whisper.cpp src

      - name: Compilar arm64 (Metal)
        working-directory: src
        run: |
          cmake -B build-arm64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DGGML_BLAS=OFF \
            -DGGML_NATIVE=OFF -DGGML_METAL=ON -DGGML_METAL_EMBED_LIBRARY=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build-arm64 --config Release -j 4 --target whisper-cli

      - name: Compilar x86_64 (Intel, CPU AVX2)
        working-directory: src
        run: |
          cmake -B build-x64 -DCMAKE_BUILD_TYPE=Release -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_OSX_ARCHITECTURES=x86_64 -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 -DGGML_BLAS=OFF \
            -DGGML_NATIVE=OFF -DGGML_METAL=OFF \
            -DGGML_AVX=ON -DGGML_AVX2=ON -DGGML_FMA=ON -DGGML_F16C=ON \
            -DWHISPER_BUILD_TESTS=OFF -DWHISPER_BUILD_SERVER=OFF
          cmake --build build-x64 --config Release -j 4 --target whisper-cli

      - name: Juntar e conferir dependencias
        run: |
          mkdir out
          cp src/build-arm64/bin/whisper-cli out/whisper-cli-mac-arm64
          cp src/build-x64/bin/whisper-cli out/whisper-cli-mac-x64
          for f in out/*; do echo "== $f"; file "$f"; otool -L "$f"; vtool -show-build "$f" | grep -E "minos|platform"; done
          # nada fora do sistema pode aparecer (senao nao roda no Mac do aluno)
          if otool -L out/* | grep -vE ':$|/usr/lib/|/System/Library/'; then echo "DEPENDENCIA EXTERNA!"; exit 1; fi

      - name: Teste de fumaca (transcreve o audio de exemplo)
        run: |
          curl -sL -o tiny.bin https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-tiny.bin
          ./out/whisper-cli-mac-arm64 -m tiny.bin -f src/samples/jfk.wav -oj -of arm | tail -3
          grep -qi "country" arm.json
          if arch -x86_64 /usr/bin/true 2>/dev/null; then
            arch -x86_64 ./out/whisper-cli-mac-x64 -m tiny.bin -f src/samples/jfk.wav -oj -of x64 | tail -3
            grep -qi "country" x64.json
          else echo "sem Rosetta no runner: x86_64 so compilado"; fi

      - uses: actions/upload-artifact@v4
        with:
          name: whisper-cli-mac
          path: out/
